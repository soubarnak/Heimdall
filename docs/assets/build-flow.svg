<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1352" width="880" height="1352" role="img" aria-labelledby="t d">
<title id="t">How Heimdall builds software</title>
<desc id="d">Flow from idea or SRS through calibration, gates G0 to G3, the autonomous build loop, QA and ship. Amber gates need the user's sign-off.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h1{font-size:26px;font-weight:700}.sub{font-size:14px}.title{font-size:16px;font-weight:700}
.body{font-size:13px}.small{font-size:11.5px}.stitle{font-size:12.5px;font-weight:700}
.badge{font-size:11px;font-weight:700}.tag{font-size:12px;font-weight:600}.legend{font-size:12px}
.spine{stroke-width:2}.c-you{stroke-width:1.5}.c-agent,.c-record,.step{stroke-width:1}
.arrow{stroke-width:1.6;fill:none}.dash{stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.dlabel{font-size:11.5px;font-weight:600}
text{fill:#17212B}.sub,.body,.small,.legend{fill:#4F5D6B}.badge,.tag{fill:#FFFFFF}.bg{fill:#F4F6F8}.spine{stroke:#B9C3CE}.c-you{fill:#FDF2E4;stroke:#A85A06}.c-agent{fill:#E5F3F1;stroke:#0E6F68}.c-record{fill:#E7EDF4;stroke:#3B5873}.b-you,.ahy{fill:#A85A06}.b-agent,.ah{fill:#0E6F68}.b-record{fill:#3B5873}.step{fill:#FFFFFF;stroke:#0E6F68}.arrow{stroke:#0E6F68}.dash{stroke:#A85A06}.dlabel{fill:#A85A06}
@media (prefers-color-scheme: dark){text{fill:#E5ECF2}.sub,.body,.small,.legend{fill:#9AA8B6}.badge,.tag{fill:#0E151C}.bg{fill:#0E151C}.spine{stroke:#33414F}.c-you{fill:#2A1E10;stroke:#F0A341}.c-agent{fill:#0F2826;stroke:#45C4B4}.c-record{fill:#172330;stroke:#93B4D3}.b-you,.ahy{fill:#F0A341}.b-agent,.ah{fill:#45C4B4}.b-record{fill:#93B4D3}.step{fill:#141D26;stroke:#45C4B4}.arrow{stroke:#45C4B4}.dash{stroke:#F0A341}.dlabel{fill:#F0A341}}
</style>
<rect class="bg" x="0" y="0" width="880" height="1352" rx="14"/>
<text class="h1" x="40" y="50">How Heimdall builds software</text>
<text class="sub" x="40" y="76">From an idea or an SRS to a shipped release. Amber gates wait for your decision.</text>
<rect class="b-you" x="40" y="96" width="12" height="12" rx="3"/>
<text class="legend" x="58" y="106.5">You decide</text>
<rect class="b-agent" x="150" y="96" width="12" height="12" rx="3"/>
<text class="legend" x="168" y="106.5">Agents work</text>
<rect class="b-record" x="266" y="96" width="12" height="12" rx="3"/>
<text class="legend" x="284" y="106.5">Published to the tracker</text>
<line class="spine" x1="70" y1="158" x2="70" y2="1216"/>
<rect class="c-you" x="116" y="136" width="740" height="64" rx="10"/>
<rect class="b-you" x="40" y="145" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="162.5" text-anchor="middle">START</text>
<text class="title" x="134" y="163">You describe the idea</text>
<text class="body" x="134" y="184">“Use Heimdall: build a habit tracker”, or attach a PRD or SRS.</text>
<rect class="c-agent" x="116" y="214" width="740" height="64" rx="10"/>
<rect class="b-agent" x="40" y="223" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="240.5" text-anchor="middle">STEP 0</text>
<text class="title" x="134" y="241">Calibrate</text>
<text class="body" x="134" y="262">Detects the harness, model tier, git remote, gh, tea and podman. One question at most.</text>
<rect class="c-agent" x="116" y="292" width="740" height="84" rx="10"/>
<rect class="b-agent" x="40" y="301" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="318.5" text-anchor="middle">G0</text>
<text class="title" x="134" y="319">Intake</text>
<text class="body" x="134" y="340">Idea: discovery research, then at most 4 multiple-choice questions per message, 2 rounds.</text>
<text class="body" x="134" y="358">SRS: normalize it, find the gaps, ask only about gaps. Existing code: a Scout maps it (G0.5).</text>
<rect class="c-you" x="116" y="390" width="740" height="84" rx="10"/>
<rect class="b-you" x="40" y="399" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="416.5" text-anchor="middle">G1</text>
<text class="title" x="134" y="417">Spec</text>
<text class="body" x="134" y="438">User stories, success criteria, NFRs, test plan, out of scope.</text>
<text class="body" x="134" y="456">Pick Prototype, MVP or Production rigor. Briefing: decide, do, learn.</text>
<rect class="b-you" x="736" y="400" width="104" height="24" rx="12"/>
<text class="tag" x="788.0" y="416" text-anchor="middle">You sign off</text>
<rect class="c-you" x="116" y="488" width="740" height="84" rx="10"/>
<rect class="b-you" x="40" y="497" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="514.5" text-anchor="middle">G2</text>
<text class="title" x="134" y="515">Architecture</text>
<text class="body" x="134" y="536">Researched stack options; each choice you make becomes an ADR.</text>
<text class="body" x="134" y="554">Module map for parallel work, test seams, tracker, model per role.</text>
<rect class="b-you" x="736" y="498" width="104" height="24" rx="12"/>
<text class="tag" x="788.0" y="514" text-anchor="middle">You sign off</text>
<rect class="c-you" x="116" y="586" width="740" height="64" rx="10"/>
<rect class="b-you" x="40" y="595" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="612.5" text-anchor="middle">G2.5</text>
<text class="title" x="134" y="613">Visual direction</text>
<text class="body" x="134" y="634">UI builds only: choose from mockups; it becomes the design contract.</text>
<rect class="b-you" x="763" y="596" width="77" height="24" rx="12"/>
<text class="tag" x="801.5" y="612" text-anchor="middle">You pick</text>
<rect class="c-record" x="116" y="664" width="740" height="84" rx="10"/>
<rect class="b-record" x="40" y="673" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="690.5" text-anchor="middle">G3</text>
<text class="title" x="134" y="691">Ticket graph</text>
<text class="body" x="134" y="712">Vertical slices T01…Tnn: criteria, seams, touch set, locks, blockers.</text>
<text class="body" x="134" y="730">Published as issues with heimdall:* labels. Bootstrap commit.</text>
<rect class="b-you" x="743" y="674" width="97" height="24" rx="12"/>
<text class="tag" x="791.5" y="690" text-anchor="middle">You confirm</text>
<rect class="c-agent" x="116" y="762" width="740" height="340" rx="10"/>
<rect class="b-agent" x="40" y="771" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="788.5" text-anchor="middle">G4–G5</text>
<text class="title" x="134" y="789">Build loop</text>
<text class="body" x="134" y="810">Runs on its own. Every step shows up in the tracker.</text>
<rect class="step" x="134" y="828" width="208" height="88" rx="8"/>
<text class="stitle" x="146" y="849">1  Pick the frontier</text>
<text class="small" x="146" y="869">Ready tickets with no open blockers,</text>
<text class="small" x="146" y="885">no shared files, no held locks.</text>
<text class="small" x="146" y="901">Up to 3 run in parallel.</text>
<rect class="step" x="382" y="828" width="208" height="88" rx="8"/>
<text class="stitle" x="394" y="849">2  Coder, own worktree</text>
<text class="small mono" x="394" y="869">heimdall/t03-habits</text>
<text class="small" x="394" y="885">test(T03) fails, then feat(T03)</text>
<text class="small" x="394" y="901">passes. Reports STATUS: DONE.</text>
<rect class="step" x="630" y="828" width="208" height="88" rx="8"/>
<text class="stitle" x="642" y="849">3  Pull request</text>
<text class="small" x="642" y="869">The orchestrator pushes the</text>
<text class="small" x="642" y="885">branch and opens a PR that</text>
<text class="small" x="642" y="901">says “Closes #12”.</text>
<rect class="step" x="630" y="962" width="208" height="88" rx="8"/>
<text class="stitle" x="642" y="983">4  Reviewer, fresh context</text>
<text class="small" x="642" y="1003">Checks spec, standards, TDD</text>
<text class="small" x="642" y="1019">evidence, security and scope.</text>
<text class="small mono" x="642" y="1035">VERDICT: APPROVE</text>
<rect class="step" x="382" y="962" width="208" height="88" rx="8"/>
<text class="stitle" x="394" y="983">5  Serial merger</text>
<text class="small" x="394" y="1003">Head SHA check, git merge-tree</text>
<text class="small" x="394" y="1019">dry run, squash merge, full</text>
<text class="small" x="394" y="1035">suite on the merged result.</text>
<rect class="step" x="134" y="962" width="208" height="88" rx="8"/>
<text class="stitle" x="146" y="983">6  Close and repeat</text>
<text class="small" x="146" y="1003">Issue closed with the merge</text>
<text class="small" x="146" y="1019">commit. Unblocked tickets</text>
<text class="small" x="146" y="1035">join the next frontier.</text>
<line class="arrow" x1="346" y1="872.0" x2="372" y2="872.0"/>
<path class="ah" d="M378 872.0 l-8 -4.5 v9 z"/>
<line class="arrow" x1="594" y1="872.0" x2="620" y2="872.0"/>
<path class="ah" d="M626 872.0 l-8 -4.5 v9 z"/>
<line class="arrow" x1="734.0" y1="920" x2="734.0" y2="952"/>
<path class="ah" d="M734.0 958 l-4.5 -8 h9 z"/>
<line class="arrow" x1="626" y1="1006.0" x2="600" y2="1006.0"/>
<path class="ah" d="M594 1006.0 l8 -4.5 v9 z"/>
<line class="arrow" x1="378" y1="1006.0" x2="352" y2="1006.0"/>
<path class="ah" d="M346 1006.0 l8 -4.5 v9 z"/>
<line class="arrow" x1="238.0" y1="958" x2="238.0" y2="926"/>
<path class="ah" d="M238.0 920 l-4.5 8 h9 z"/>
<path class="dash" d="M670 958 C670 939.0, 540 939.0, 540 927"/>
<path class="ahy" d="M540 920 l-4.5 8 h9 z"/>
<text class="dlabel" x="530" y="943.0" text-anchor="end">changes requested: fix round, max 2</text>
<text class="small" x="134" y="1080">A stuck coder reports <tspan class="mono">STATUS: BLOCKED</tspan>. The orchestrator routes it and is the only agent that asks you.</text>
<rect class="c-agent" x="116" y="1116" width="740" height="64" rx="10"/>
<rect class="b-agent" x="40" y="1125" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="1142.5" text-anchor="middle">G6</text>
<text class="title" x="134" y="1143">QA</text>
<text class="body" x="134" y="1164">Whole-build review and an end-to-end QA agent. Problems become fix tickets.</text>
<rect class="b-you" x="669" y="1126" width="171" height="24" rx="12"/>
<text class="tag" x="754.5" y="1142" text-anchor="middle">Sign-off in Production</text>
<rect class="c-you" x="116" y="1194" width="740" height="84" rx="10"/>
<rect class="b-you" x="40" y="1203" width="60" height="26" rx="6"/>
<text class="badge mono" x="70" y="1220.5" text-anchor="middle">G7</text>
<text class="title" x="134" y="1221">Ship</text>
<text class="body" x="134" y="1242">Release to the hosting target chosen at G2.</text>
<text class="body" x="134" y="1260">Operations handover: how to run, monitor, update and back up.</text>
<rect class="b-you" x="736" y="1204" width="104" height="24" rx="12"/>
<text class="tag" x="788.0" y="1220" text-anchor="middle">You sign off</text>
<text class="small" x="40" y="1314">Merge conflicts are prevented by design: touch sets, shared-file locks, one worktree per ticket, one serial merger.</text>
<text class="small" x="40" y="1332">They become rare, not impossible; the full test suite on every merged result catches the rest.</text>
</svg>
